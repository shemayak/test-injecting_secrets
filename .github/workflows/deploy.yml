name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Fix: Target index.js (or whatever file actually holds the placeholder)
      - name: Inject Secret into index.js
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "__MY_SECRET_API_KEY__"
          replace: ${{ secrets.MY_API_KEY }}
          include: "index.js"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
