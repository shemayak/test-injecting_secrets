name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Only runs when you push to main

# Set permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Pull down your source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup GitHub Pages environment configurations
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. Create an isolated distribution directory
      - name: Prepare Deployment Directory
        run: |
          mkdir dist
          cp index.html dist/
          cp -r css js dist/ || true

      # 4. Inject Secret ONLY inside the isolated deployment directory
      - name: Inject Secret into index.html
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "__MY_SECRET_API_KEY__"
          replace: ${{ secrets.TEST }}
          include: "dist/index.html"

      # 5. Upload the isolated folder as a safe, temporary artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      # 6. Deploy the artifact directly to GitHub Pages without using a branch
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
